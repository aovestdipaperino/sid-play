[workspace]
members = ["crates/sid-play"]
resolver = "3"

[workspace.package]
edition = "2024"

# The timing tests render 20-30 emulated seconds; with the 6510 and SID crates
# unoptimised that takes minutes, optimised it takes seconds. Only dependencies
# are optimised, so sid-play itself stays debuggable.
[profile.dev.package."*"]
opt-level = 3
