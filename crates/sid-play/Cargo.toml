[package]
name = "sid-play"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aovestdipaperino/sid-play"
description = "Play C64 PSID tunes through the mos6581 SID emulator"
readme = "README.md"
keywords = ["sid", "psid", "c64", "player", "chiptune"]
categories = ["emulators", "multimedia::audio"]
# The scripts are workspace tools (tonality measurement), not part of the crate.
exclude = ["scripts/"]

[dependencies]
mos6510 = "0.1"
mos6581 = "0.2"

[[bin]]
name = "render"
path = "src/main.rs"
