[package]
name = "sid-play"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aovestdipaperino/sid-play"
description = "Play C64 PSID tunes through the mos6581 SID emulator"
readme = "README.md"
keywords = ["sid", "psid", "c64", "player", "chiptune"]
categories = ["emulators", "multimedia::audio"]
# The scripts only work inside the workspace (they build both configs from its root).
exclude = ["scripts/"]

[dependencies]
mos6510 = "0.1"
mos6581 = { path = "../mos6581", version = "0.1" }
sid-gpl-data = { path = "../sid-gpl-data", version = "0.1", optional = true }

[features]
default = []
# Measured tables and the libsidplayfp power-on pattern. Makes the build GPL-2.0.
gpl-data = ["mos6581/gpl-data", "dep:sid-gpl-data"]

[[bin]]
name = "render"
path = "src/main.rs"
